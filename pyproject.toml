[project]
name = "mojo-glob"
version = "0.1.1"
description = "Shell-style wildcards for Mojo: fnmatch and glob (recursive **, root_dir), identical to Python"
license = "Apache-2.0"
requires-python = ">=3.11,<3.15"
dependencies = ["mojo>=1.2.0,<1.3"]

[project.urls]
Homepage = "https://github.com/amarbaro/mojo-glob"
Repository = "https://github.com/amarbaro/mojo-glob"
